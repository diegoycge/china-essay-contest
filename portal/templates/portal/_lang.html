{% load i18n %}{% get_current_language as LANG %}
<form method="post" action="{% url 'set_language' %}" class="lang-switch" aria-label="{% translate 'Language' %}">
  {% csrf_token %}
  <input type="hidden" name="next" value="{{ request.get_full_path }}">
  <button type="submit" name="language" value="en" class="{% if LANG == 'en' %}active{% endif %}" lang="en">EN</button>
  <button type="submit" name="language" value="zh-hans" class="{% if LANG != 'en' %}active{% endif %}" lang="zh-Hans">中文</button>
</form>
